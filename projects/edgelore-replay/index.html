<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edgelore · 一段记忆的来路</title><link rel="stylesheet" href="./replay.css?v=5"><link rel="stylesheet" href="./memory-graph.css?v=5"><link rel="stylesheet" href="./theme-a.css?v=4"><link rel="stylesheet" href="./embed-layout.css?v=7"><link rel="stylesheet" href="../../assets/demo-shell.css?v=3"><link rel="stylesheet" href="./markdown.css?v=1"><link rel="stylesheet" href="../../assets/project-experience.css?v=11"><link rel="stylesheet" href="../../assets/edgelore-pixel.css?v=3"><script src="../../scripts/finance-style.js?v=3"></script><link rel="stylesheet" href="../../assets/demo-consistency.css?v=5"></head>
<body><main class="replay" id="replay">
  <header class="masthead"><div class="brand"><span class="brand-mark" aria-hidden="true">e.</span><div><strong>Edgelore</strong><small>记忆 · 冲突 · 汇报</small></div></div><span class="archive-tag"><i></i>22 轮真实记录 · 本地回放</span></header><div id="archive-replay">
  <nav class="chapters" aria-label="跳到对话阶段"><button data-jump="1" type="button"><span>01</span>案例竞赛</button><button data-jump="6" type="button"><span>02</span>数据挖掘</button><button data-jump="12" type="button"><span>03</span>营销研究</button><button data-jump="18" type="button"><span>04</span>学术交流</button><button data-jump="23" type="button" class="recall-tab"><span>↗</span>换个会话，再问一次</button></nav>
  <div class="workspace">
    <section class="conversation" aria-label="测评对话回放"><header class="pane-head"><div><span class="eyebrow">CONVERSATION</span><h2 id="session-title">案例竞赛</h2></div><time id="session-date"></time></header><div class="messages" id="messages" tabindex="0" aria-label="已展示的对话"></div><div class="composer"><span class="eyebrow" id="composer-label">下一轮 · 中文节选</span><textarea id="next-message" readonly aria-label="下一轮预设对话" rows="3">正在读取本地记录…</textarea><div class="composer-actions"><span class="preset-label">预设对话 <span id="turn-count">00 / 22</span></span><div class="model-controls"><span class="mock-model" title="演示模型名；仅回放缓存，不调用在线模型">Mock-6 Ultra <small>回放</small></span><button id="send" type="button" aria-label="发送下一轮" title="发送下一轮" disabled>↑</button><span class="edgelore-click-hint" aria-hidden="true">CLICK HERE!</span></div></div></div></section>
    <section class="memory" aria-label="记忆与来源"><header class="pane-head"><div><span class="eyebrow">MEMORY ATLAS</span><h2>记住的，和它的来处。</h2></div><div class="memory-count"><b id="memory-count">0</b><span id="memory-total">/ 27 条</span></div></header><div class="memory-toolbar"><p><i class="dot accepted"></i>已采纳 <b id="accepted-count">0</b><i class="dot tentative"></i>待确认 <b id="tentative-count">0</b></p><span id="change-status" role="status">读取中</span></div>
      <div class="atlas"><div class="graph-topline"><span>MEMORY GRAPH <span id="graph-size"></span></span><div class="graph-controls"><button id="graph-focus" hidden>全部记忆</button><button id="zoom-out" aria-label="缩小关系图">−</button><button id="zoom-in" aria-label="放大关系图">+</button><button id="graph-reset" aria-label="重置关系图视角">⌖</button></div></div><svg id="atlas" viewBox="0 0 660 550" role="group" aria-label="可拖动、缩放的记忆节点关系图"></svg><div class="graph-legend"><span><i class="legend-session"></i>会话</span><span><i class="legend-memory"></i>记忆</span><span><i class="legend-entity"></i>实体</span><span class="graph-tip">拖动节点 · Ctrl + 滚轮缩放</span></div><p class="atlas-note" id="atlas-note">点击节点查看原文与来源。</p></div>
      <div class="inspector"><div class="inspector-top"><span class="eyebrow">查看记忆</span><select id="memory-select" aria-label="选择已经展示的记忆"></select></div><div id="evidence" aria-live="polite"></div></div>
    </section>
  </div>
  <footer class="playback"><button id="play" type="button" disabled>▷ 播放</button><input id="scrub" type="range" min="0" max="26" value="0" aria-label="回放进度" disabled><span id="progress-label">开始</span><button id="reset" type="button" disabled>重播 ↺</button></footer>
  <p class="load-error" id="load-error" hidden>本地记录暂时无法读取，请刷新页面重试。</p>
