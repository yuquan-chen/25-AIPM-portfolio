<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>城市观察窗</title><style>
*{box-sizing:border-box}html,body{overflow:hidden;margin:0;background:#173d31;color:#eee8d7;font:12px/1.5 'Microsoft YaHei',sans-serif}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.controls{height:48px;padding:0 16px;display:flex;align-items:center;justify-content:flex-end;border-top:1px solid #8caa8240;background:#123328}.volume{display:flex;align-items:center;gap:7px;color:#bfccb6;font-size:10px}input{width:74px;accent-color:#e6aa91;cursor:pointer;margin:0}output{min-width:26px;font-variant-numeric:tabular-nums}button:focus-visible,input:focus-visible{outline:2px solid #e6aa91;outline-offset:2px}@media(max-width:380px){.controls{padding:0 9px}.volume{gap:5px}input{width:60px}}
.city-scene{position:relative}.notebook-hotspot{position:absolute;left:74%;bottom:4%;width:13%;height:11%;min-width:44px;min-height:44px;padding:0;background:transparent;border:0;cursor:pointer;touch-action:manipulation}.notebook-hotspot:focus-visible{outline:1px dashed #f0d7ae;outline-offset:2px}.notebook-hint{position:absolute;right:0;bottom:calc(100% + 3px);white-space:nowrap;padding:5px 8px;background:#123328ed;border:1px solid #afbb9470;color:#f0ddbb;font-size:11px;opacity:0;transform:translateY(3px);transition:opacity .18s,transform .18s;pointer-events:none}.notebook-hotspot:hover .notebook-hint,.notebook-hotspot:focus .notebook-hint{opacity:1;transform:none}@media(hover:none){.notebook-hint{opacity:1;transform:none;font-size:9px;padding:3px 6px}}@media(prefers-reduced-motion:reduce){.notebook-hint{transition:none}}
</style></head><body>
<div class="city-scene">
<canvas id="city" width="640" height="360" role="img" aria-label="像素列车窗外，沿街住宅、树木与河桥缓慢经过，小车驶过时浮起音符。调节音量可听见沿途声景。"></canvas>
<button id="notebook-hotspot" class="notebook-hotspot" type="button" aria-label="翻开车厢里的研究笔记" aria-expanded="false"><span class="notebook-hint" aria-hidden="true">翻开研究笔记 ↗</span></button>
</div>
<div class="controls"><div class="volume"><label for="volume">音量</label><input id="volume" type="range" min="0" max="100" value="0" aria-label="音量，零为静音"><output id="volume-value" for="volume">0%</output></div></div>
<script src="train-sound.js?v=20261008-softscape-1"></script><script src="train-city.js?v=20261008-fixed-dusk-1"></script><script src="train-window.js?v=20261008-fixed-dusk-1"></script>
<script>
const reportSize=()=>parent.postMessage({type:'city-window-size',height:Math.ceil(document.querySelector('canvas').getBoundingClientRect().height+document.querySelector('.controls').getBoundingClientRect().height)+1},location.origin);
new ResizeObserver(reportSize).observe(document.body);reportSize();
</script></body></html>
